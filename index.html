<!doctype html>
<html lang="en">
  <head>
    <!-- Charset and Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Title -->
    <title>Satvik's Portfolio ✨</title>
    
    <!-- Meta Description (SEO) -->
    <meta name="description" content="Satvik's Portfolio! Explore my projects, skills, and experiences in cybersecurity." />
    
    <!-- Meta Keywords (SEO) -->
    <meta name="keywords" content="Satvik, Portfolio, Web Developer, Software Engineer, Web Design, Frontend Developer, JavaScript, React, TypeScript, Developer Portfolio, Coding Projects, Penetration Tester, OSINT, Anonbash, HackOps, Vemulapalli, Satvik Vemulapalli" />
    
    <!-- Author Meta Tag -->
    <meta name="author" content="Satvik" />
    
    <!-- Open Graph (for better social media sharing) -->
    <meta property="og:title" content="Satvik's Portfolio ✨" />
    <meta property="og:description" content="Explore Satvik's Portfolio. Learn more about my work in cybersecurity and OSINT. Check out my projects and coding expertise!" />
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/111590060?v=4" />
    <meta property="og:url" content="https://satvik.live" />
    <meta property="og:type" content="website" />
    
    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Satvik's Portfolio ✨" />
    <meta name="twitter:description" content="Explore Satvik's cybersecurity portfolio, featuring projects, technical skills, and accomplishments. Let's connect and innovate together!" />
    <meta name="twitter:image" content="https://avatars.githubusercontent.com/u/111590060?v=4" />
    <meta name="twitter:creator" content="@anonbash1" />
    <meta name="twitter:site" content="@anonbash1" />
    
    <!-- Canonical URL (avoids duplicate content issues) -->
    <link rel="canonical" href="https://satvik.live" />
    
    <!-- Structured Data (JSON-LD for rich snippets) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Satvik",
        "url": "https://satvik.live",
        "sameAs": [
          "https://www.linkedin.com/in/satvik-vemulapalli",
          "https://github.com/satvikblog",
          "https://twitter.com/anonbash",
          "https://instagram.com/satvikshetty.v",
          "https://instagram.com/nenuhackeravtha"
        ],
        "description": "Satvik is a passionate cybersecurity enthusiast proficient in penetration testing (web and host), cloud security, and web development."
      }
    </script>
    
    <!-- Open Graph Image Dimensions -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Google Search Verification -->
    <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE" />
    
    <!-- Robots Meta Tag -->
    <meta name="robots" content="index, follow" />
    
    <!-- Improved Performance -->
    <link rel="stylesheet" href="/styles/main.css" />
    <script src="/scripts/main.js" defer></script>
    
    <!-- Lazy Loading Images -->
    <link rel="preload" href="https://avatars.githubusercontent.com/u/111590060?v=4" as="image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
